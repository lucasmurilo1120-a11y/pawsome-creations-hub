name: curl
on:
  push:
    branches: [ci-curl]
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sleep 60
          get() { for i in $(seq 1 24); do h=$(curl -sSL "$1/?t=$RANDOM$i" -H "cache-control: no-cache"); echo "$h" | grep -q "$2" && break; sleep 20; done; }
          c() { echo "$h" | grep -o "$1" | wc -l; }
          get https://build-your-world-853.lovable.app 'MiniMundos'
          echo "::notice title=landing::mm=$(c 'MiniMundos') papelitos=$(c 'Papelitos') heroMM=$(c 'hero-familia-mm') kitMM=$(c 'kit-paginas-mm') tuFoto=$(c 'Tu Foto, Tu Personaje') testimonios=$(c 'Lo que cuentan') bytes=$(echo "$h" | wc -c)"
          imgs=$(echo "$h" | grep -o 'https://[^"]*\.webp' | sort -u | head -8 | tr '\n' ' '); echo "::notice title=imgs::$imgs"
          get https://pawsome-creations-hub.lovable.app 'MiniMundos'
          echo "::notice title=app::mm=$(c 'MiniMundos') papelitos=$(c 'Papelitos') bytes=$(echo "$h" | wc -c)"
          js=$(echo "$h" | grep -o '/assets/[^"]*\.js' | sort -u | head -40)
          all=""; for j in $js; do all="$all$(curl -sS https://pawsome-creations-hub.lovable.app$j)"; done
          h="$all"; echo "::notice title=appjs::tuFoto=$(c 'Tu Foto, Tu Personaje') tuFamilia=$(c 'Tu Familia en la Historia') conCarita=$(c 'Con su carita o Pack') mm=$(c 'MiniMundos') papelitos=$(c 'Papelitos')"
