name: curl
on:
  push:
    branches: [ci-curl]
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sleep 60
          c() { echo "$h" | grep -o "$1" | wc -l; }
          for u in https://papelitos-carita.lovable.app https://papelitos-familia.lovable.app https://papelitos-colorear.lovable.app; do
            for i in $(seq 1 24); do h=$(curl -sSL "$u/?t=$RANDOM$i" -H "cache-control: no-cache"); echo "$h" | grep -q 'MiniMundos' && break; sleep 20; done
            html="$h"
            js=$(echo "$html" | grep -o '/assets/[^"]*\.js' | sort -u | head -40)
            all=""; for j in $js; do all="$all$(curl -sS "$u$j")"; done
            h="$html$all"
            echo "::notice title=$u::mm=$(c 'MiniMundos') papelitos=$(c 'Papelitos') pack=$(c 'Pack familia') carita=$(c 'Con su carita') tuFoto=$(c 'Tu Foto, Tu Personaje') tuFamilia=$(c 'Tu Familia en la Historia') color=$(c 'MiniMundos Color') bytes=$(echo "$html" | wc -c)"
          done
